<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职考通 - 大龄考生全职业考试备考系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* 临界 CSS：防止 FOUC */
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:#f1f5f9;color:#0f172a}
    #app{min-height:100vh}
    .skeleton{background:linear-gradient(90deg,#cbd5e1 25%,#e2e8f0 50%,#cbd5e1 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
  <div id="app">
    <!-- 骨架屏：加载中 -->
    <div style="max-width:780px;margin:0 auto;padding:72px 16px 32px">
      <div class="skeleton" style="height:56px;border-radius:8px;margin-bottom:16px"></div>
      <div style="display:flex;gap:16px;margin-bottom:16px">
        <div class="skeleton" style="flex:1;height:80px;border-radius:12px"></div>
        <div class="skeleton" style="flex:1;height:80px;border-radius:12px"></div>
      </div>
      <div class="skeleton" style="height:56px;border-radius:12px;margin-bottom:16px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="skeleton" style="height:48px;border-radius:8px"></div>
        <div class="skeleton" style="height:48px;border-radius:8px"></div>
        <div class="skeleton" style="height:48px;border-radius:8px"></div>
        <div class="skeleton" style="height:48px;border-radius:8px"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // AI面板兜底更新（页面加载后3秒强制更新,绕过模块异步链）
    setTimeout(() => {
      const el = document.getElementById('ai-insights-content');
      if (el && el.textContent.includes('完成一组刷题')) {
        // 尝试从localStorage读取学习数据
        try {
          const state = JSON.parse(localStorage.getItem('manmanji_user_state') || '{}');
          const total = (state.learnedPointsCount || 0) + (state.quizDoneCount || 0);
          const streak = state.daysStudied || 1;
          if (total > 0) {
            el.innerHTML = `<div style="margin:4px 0;font-size:12px;color:#10b981;">📝 已学习${total}题 · 🔥连续${streak}天</div><div style="margin:4px 0;font-size:12px;color:#64748b;">继续刷题解锁AI深度诊断</div>`;
          } else {
            el.innerHTML = '<div style="font-size:12px;color:#64748b;">📝 完成一组刷题后解锁AI诊断 · <a href="#" onclick="document.querySelector(\'.flow-step\')?.click()" style="color:#6366f1;">开始刷题 →</a></div>';
          }
        } catch(e) { el.innerHTML = '<div style="font-size:12px;color:#64748b;">📝 完成一组刷题后解锁AI诊断</div>'; }
      }
    }, 3000);
  </script>
</body>
</html>
