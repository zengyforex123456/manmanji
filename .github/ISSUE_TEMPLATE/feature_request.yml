name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "## 感谢你的建议！请描述你希望的功能"
  - type: input
    id: summary
    attributes:
      label: 功能简述
      description: 一句话描述你想要的功能
      placeholder: "如：支持批量下载讲义资料"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 功能类型
      options: ["新功能", "体验改进", "内容更新", "性能优化", "其他"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      placeholder: "目前每次只能下载一个文件，考试有几十个文件，操作太繁琐"
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      placeholder: "在资料页面增加'全选下载'按钮，可以一次下载所选科目的全部资料"
  - type: dropdown
    id: importance
    attributes:
      label: 对你有多重要？
      options: ["必须（不用这个功能没法考试）", "很重要（每天都会用到）", "一般（偶尔用到）", "锦上添花"]
    validations:
      required: true
  - type: input
    id: user_type
    attributes:
      label: 你的考生类型（可选）
      placeholder: "如：中级经济师 / 中级会计师"
