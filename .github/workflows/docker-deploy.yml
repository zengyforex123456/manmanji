name: Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手动触发

env:
  IMAGE: jijianzhikao
  SERVER: root@46.38.245.170

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: node --check src/main.js
      - run: node --check src/api.js
      - run: node --check server/index.js
      - run: npm run build
      - run: test -f dist/index.html
      - run: grep -q "generate-questions" dist/assets/index-*.js || { echo "Missing API"; exit 1; }

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Save and transfer
        run: |
          docker save $IMAGE:latest | gzip > image.tar.gz
          echo "${{ secrets.SSH_KEY }}" > key.pem && chmod 600 key.pem
          scp -o StrictHostKeyChecking=no -i key.pem image.tar.gz $SERVER:/tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker load < /tmp/image.tar.gz
            docker stop jjzk 2>/dev/null || true
            docker rm jjzk 2>/dev/null || true
            docker run -d --name jjzk -p 3010:80 \
              -e DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }} \
              --restart unless-stopped $IMAGE:latest
            sleep 3
            curl -sf http://localhost:3010/api/health && echo "✅ Deploy OK" || echo "❌ Deploy FAILED"
            rm /tmp/image.tar.gz
